# ローカル開発用 DB
#   MongoDB 版（backend-node / backend-spring） : docker compose up -d mongo
#   PostgreSQL 版（backend-spring-pg）         : docker compose up -d postgres
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: cathreport
      POSTGRES_USER: cathreport
      POSTGRES_PASSWORD: cathreport
      TZ: Asia/Tokyo
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cathreport -d cathreport"]
      interval: 5s
      retries: 10
volumes:
  mongo-data:
  pg-data:
