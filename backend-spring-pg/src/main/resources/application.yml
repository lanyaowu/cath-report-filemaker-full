server:
  port: ${PORT:8080}
  ssl:   # HTTPS（SSL_ENABLED=true と鍵ストアを指定）
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
spring:
  application:
    name: cath-report-backend-pg
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cathreport}
    username: ${DB_USER:cathreport}
    password: ${DB_PASSWORD:cathreport}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # スキーマは Flyway（db/migration）で管理
    properties:
      hibernate:
        default_batch_fetch_size: 100   # 一覧取得時の N+1 を回避
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-request-size: 20MB
app:
  cors-origins: ${CORS_ORIGIN:http://localhost:5173}
  seed-on-startup: ${SEED_ON_STARTUP:true}
  allow-seed-api: ${ALLOW_SEED_API:false}   # POST /api/admin/seed（全データ置換）を許可するか
  auth:
    enabled: ${AUTH_ENABLED:true}
    secret: ${AUTH_SECRET:}
    token-ttl-minutes: ${AUTH_TOKEN_TTL_MIN:480}
    users-file: ${AUTH_USERS_FILE:}

---
# SQL を確認したいとき: SPRING_PROFILES_ACTIVE=sql
spring:
  config:
    activate:
      on-profile: sql
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
